name: Build APK from zip

on:
  workflow_dispatch:
  push:
    paths:
      - "OfflineReader.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q OfflineReader.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: project/OfflineReader
        run: gradle assembleDebug --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineReader-debug-apk
          path: project/OfflineReader/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK as a Release (direct download on phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" \
            project/OfflineReader/app/build/outputs/apk/debug/app-debug.apk \
            --title "APK v${{ github.run_number }}" \
            --notes "Debug build"
